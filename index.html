<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121318">
<title>Fireguard Rota</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🔥 Fireguard Rota</h1>
  <div id="sync" class="sync connecting">● …</div>
  <div id="clock"></div>
</header>

<main>
  <section id="tab-tonight" class="tab active"></section>
  <section id="tab-crew" class="tab"></section>
  <section id="tab-history" class="tab"></section>
</main>

<nav>
  <button class="active" data-act="tab" data-tab="tonight"><span>🌙</span>Tonight</button>
  <button data-act="tab" data-tab="crew"><span>👷</span>Crew</button>
  <button data-act="tab" data-tab="history"><span>📜</span>History</button>
</nav>

<div id="roulette" class="overlay hidden">
  <div class="rbox">
    <h2>🎰 Jackpot Roulette</h2>
    <div class="wheelwrap">
      <div class="pointer">▼</div>
      <canvas id="wheel" width="600" height="600"></canvas>
    </div>
    <div id="r-result"></div>
    <button id="r-btn" class="big">SPIN! 🎰</button>
    <button id="r-skip" class="link">Skip animation</button>
    <button id="r-cancel" class="link">Cancel</button>
  </div>
</div>

<div id="modal" class="overlay hidden">
  <div class="mbox">
    <h2 id="m-title"></h2>
    <div id="m-body"></div>
    <div class="actions">
      <button id="m-cancel" class="btn">Cancel</button>
      <button id="m-ok" class="btn acc">Save</button>
    </div>
  </div>
</div>

<input type="file" id="restore-file" accept="application/json,.json" hidden>
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
